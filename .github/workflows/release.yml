# This GitHub workflow will be invoked in below scenarios:
#
# 1. Publishing a release
#

name: Release with Gradle

on:
  release:
    types: [ published ]

jobs:
  publish-release:
    runs-on: ${{ github.repository != 'GoDaddyRegistry/registrar-toolkit' && '6760-narwhaldevappspo' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      JF_URL: ${{ vars.JF_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # @v4.2.2
      - uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b  # @v4.6.0
        with:
          java-version: '8'
          distribution: 'adopt'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0bdd871935719febd78681f197cd39af5b6e16a6  # @v4.2.2
      - name: Cache Gradle packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # @v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Get Artifactory Token
        if: github.repository != 'GoDaddyRegistry/registrar-toolkit'
        uses: jfrog/setup-jfrog-cli@deda456d982fc5e9a7a020b63eb0d2968aedd33e  # v5.1.0
        id: jfrog
        with:
          oidc-provider-name: github
      - name: Mask Artifactory token
        if: github.repository != 'GoDaddyRegistry/registrar-toolkit'
        run: echo "::add-mask::${{ steps.jfrog.outputs.oidc-token }}"
      - name: Publish package
        run: |
          ./gradlew -DrepoUrl="$GPR_URL" \
                    -DrepoUsername="$GPR_USER" \
                    -DrepoPassword="$GPR_TOKEN" publish
        env:
          GPR_URL: "https://maven.pkg.github.com/${{ github.repository }}"
          GPR_USER: "${{ env.GITHUB_ACTOR }}"
          GPR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          ARTIFACTORY_USERNAME: ${{ steps.jfrog.outputs.oidc-user }}
          ARTIFACTORY_PASSWORD: ${{ steps.jfrog.outputs.oidc-token }}
